name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name=ak_edu_point

      - name: Configure Google Services plugin and Firebase app config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin Gradle files were not generated by flutter create")
          s = settings.read_text()
          marker = "plugins {"
          if marker not in s:
              raise SystemExit("Could not find plugin block in settings.gradle.kts")
          if 'com.google.gms.google-services' not in s:
              s = s.replace(marker, marker + '\\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
          settings.write_text(s)
          a = app.read_text()
          if marker not in a:
              raise SystemExit("Could not find plugin block in app/build.gradle.kts")
          if 'com.google.gms.google-services' not in a:
              a = a.replace(marker, marker + '\\n    id("com.google.gms.google-services")', 1)
          app.write_text(a)
          PY
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ak-edu-point-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
