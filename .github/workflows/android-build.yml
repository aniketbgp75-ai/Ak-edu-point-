name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name=ak_edu_point

      - name: Configure Google Services plugin and Firebase app config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin Gradle files were not generated by flutter create")
          s = settings.read_text()
          marker = "plugins {"
          if marker not in s:
              raise SystemExit("Could not find plugin block in settings.gradle.kts")
          if 'com.google.gms.google-services' not in s:
              s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
          settings.write_text(s)
          a = app.read_text()
          import re
          # Newer file_picker lifecycle dependency requires Android API 36.
          a, sdk_count = re.subn(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36", a, count=1)
          if sdk_count != 1:
              raise SystemExit("Could not set Android compileSdk to 36")
          if marker not in a:
              raise SystemExit("Could not find plugin block in app/build.gradle.kts")
          if 'com.google.gms.google-services' not in a:
              a = a.replace(marker, marker + '\n    id("com.google.gms.google-services")', 1)

          # Match the package registered in Firebase.
          import re
          package_name = "com.aniketbgp75.akedupoint"
          a, ns_count = re.subn(r'namespace\s*=\s*"[^"]+"', f'namespace = "{package_name}"', a, count=1)
          a, app_count = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', a, count=1)
          if ns_count != 1 or app_count != 1:
              raise SystemExit("Could not set Android namespace/applicationId to Firebase package")

          # flutter_local_notifications requires Java core library desugaring.
          if "isCoreLibraryDesugaringEnabled" not in a:
              a = a.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "coreLibraryDesugaring(" not in a:
              dependency_line = "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")"
              if "dependencies {" in a:
                  a = a.replace("dependencies {", "dependencies {\n" + dependency_line, 1)
              else:
                  a += "\n\ndependencies {\n" + dependency_line + "\n}\n"
          # Verify both Gradle desugaring settings were inserted.
          if "isCoreLibraryDesugaringEnabled = true" not in a or "coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")" not in a:
              raise SystemExit("Could not configure core library desugaring")
          app.write_text(a)

          # Keep the generated launcher Activity in the same Java/Kotlin package.
          candidates = list(Path("android/app/src/main").glob("**/MainActivity.kt")) + list(Path("android/app/src/main").glob("**/MainActivity.java"))
          if not candidates:
              raise SystemExit("Could not find generated MainActivity")
          activity = candidates[0]
          source = activity.read_text()
          source = re.sub(r'^package\s+[^;\n]+;?\s*', f'package {package_name}\n', source, count=1, flags=re.M)
          target = Path("android/app/src/main/kotlin") / Path(*package_name.split(".")) / activity.name
          if activity.suffix == ".java":
              target = Path("android/app/src/main/java") / Path(*package_name.split(".")) / activity.name
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          activity.unlink()
          PY
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

          # Add permissions and receivers required for scheduled local reminders.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          '''
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", permissions + "\\n    <application", 1)
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if "ScheduledNotificationReceiver" not in s:
              s = s.replace("</application>", receivers + "\\n    </application>", 1)
          p.write_text(s)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ak-edu-point-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
